[package]
name = "saathi-broker"
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "saathi-broker"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = "0.4"
tss-esapi = { version = "7.7", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemServices"] }

[features]
default = []
tpm = ["dep:tss-esapi"]

[lints]
workspace = true
