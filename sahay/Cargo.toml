[package]
name = "sahay"
version = "2.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Sahay: a helper that reads the screen locally and drives a Windows PC, guided by Groq"

[[bin]]
name = "sahay"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
native-tls = "0.2"
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_Media_Speech",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
