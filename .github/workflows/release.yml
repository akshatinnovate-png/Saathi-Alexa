name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.0.0'
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          SAATHI_METRICS: 'off'
      - name: Release notes from CHANGELOG.md
        run: |
          version="${VERSION#v}"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "PLAIN=$version" >> "$GITHUB_ENV"
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Software bill of materials and source archive
        run: |
          npm sbom --omit=dev --sbom-format cyclonedx > "saathi-$PLAIN.cdx.json"
          npm sbom --omit=dev --sbom-format spdx > "saathi-$PLAIN.spdx.json"
          git archive --format=tar.gz --prefix="saathi-$PLAIN/" -o "saathi-$PLAIN.tar.gz" HEAD
          sha256sum "saathi-$PLAIN.tar.gz" "saathi-$PLAIN.cdx.json" "saathi-$PLAIN.spdx.json" > SHA256SUMS
      - name: Publish the Docker image
        id: image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.version=$PLAIN" -t "$image:$PLAIN" -t "$image:latest" .
          docker push "$image:$PLAIN"
          docker push "$image:latest"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$PLAIN" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - name: Prove where the source archive came from
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            saathi-${{ env.PLAIN }}.tar.gz
            saathi-${{ env.PLAIN }}.cdx.json
            saathi-${{ env.PLAIN }}.spdx.json
      - name: Prove where the Docker image came from
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attach the SBOM to the Docker image
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: saathi-${{ env.PLAIN }}.spdx.json
          push-to-registry: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --title "Saathi $TAG" --notes-file notes.md --target "$GITHUB_SHA" \
            "saathi-$PLAIN.tar.gz" "saathi-$PLAIN.cdx.json" "saathi-$PLAIN.spdx.json" SHA256SUMS
