name: Sign past releases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        tag: [v1.0.0]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ matrix.tag }}
    steps:
      - name: Download the published files
        run: |
          mkdir -p files
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D files || true
          if [ -z "$(ls -A files)" ]; then gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D files --archive=tar.gz; fi
          rm -f files/*.intoto.jsonl files/*.sigstore.json
          ls -la files
      - name: Sign them with this repository's workflow identity
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: files/*
      - name: Attach the signature bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" "saathi-$TAG.intoto.jsonl"
          cp "${{ steps.provenance.outputs.bundle-path }}" "saathi-$TAG.sigstore.json"
          gh release upload "$TAG" "saathi-$TAG.intoto.jsonl" "saathi-$TAG.sigstore.json" -R "$GITHUB_REPOSITORY" --clobber
