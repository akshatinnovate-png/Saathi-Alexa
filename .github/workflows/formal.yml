name: Proofs
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: The committed WebAssembly core is a reproducible build of this source
        run: npm run check:core
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04
        with:
          toolchain: nightly
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Property-based fuzzing of parsers, guards and the WebAssembly core
        run: node --test test/fuzz.test.js
        env:
          SAATHI_FUZZ_RUNS: '20000'
      - name: libFuzzer on the Rust core's input boundary
        working-directory: core
        run: |
          cargo install --locked cargo-fuzz@0.13.2
          cargo +nightly fuzz run ffi -- -max_total_time=120
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f
        with:
          working-directory: core
          args: --output-format terse
  tla:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec: [Pairing, Sessions, Escalation, KeyRotation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch TLC
        run: |
          curl -sSfL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c -
      - name: Model check ${{ matrix.spec }}
        working-directory: formal
        run: java -XX:+UseParallelGC -cp ../tla2tools.jar tlc2.TLC -workers auto -deadlock -cleanup ${{ matrix.spec }}
      - name: Without the distinct-pictures rule, TLC must find the attack
        if: matrix.spec == 'Pairing'
        working-directory: formal
        run: |
          if java -cp ../tla2tools.jar tlc2.TLC -deadlock -cleanup -config PairingFlaw.cfg Pairing > flaw.txt 2>&1; then
            cat flaw.txt; echo "TLC should have found the attack"; exit 1
          fi
          grep -q "Invariant IntrudersNeverGetIn is violated" flaw.txt
          sed -n '/Error: Invariant/,/Finished/p' flaw.txt | head -60
