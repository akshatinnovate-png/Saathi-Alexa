name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - name: Every installed package has a valid registry signature
        run: npm audit signatures
      - name: Lockfile only resolves from the npm registry over https
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const bad = Object.entries(lock.packages).filter(([k, p]) => k && p.resolved && !p.resolved.startsWith("https://registry.npmjs.org/"));
            if (bad.length) { console.error(bad.map(([k, p]) => `${k} -> ${p.resolved}`).join("\n")); process.exit(1); }
            console.log(`${Object.keys(lock.packages).length - 1} packages, all from registry.npmjs.org`);
          '
      - name: No secrets committed
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,})' -- ':!test/**' ':!*.md'; then
            echo "A secret-looking value is committed. Remove it and rotate it."; exit 1
          fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SAATHI_METRICS: 'off'
      - run: npm run eval
      - run: npx asl-validator --json-path src/escalation/escalation.asl.json
      - run: npm run a11y
        env:
          SAATHI_METRICS: 'off'
      - run: npm ci
        working-directory: infra
      - run: npm test
        working-directory: infra
      - run: npx cdk synth --quiet
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: us-east-1
      - run: pipx run cfn-lint -i W3005 -- cdk.out/Saathi.template.json
        working-directory: infra
  broker-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libtss2-dev swtpm swtpm-tools tpm2-tools
      - run: cargo build --locked --release -p saathi-broker --features tpm
      - run: npm ci
      - name: Key broker against a software TPM
        run: |
          mkdir -p "$RUNNER_TEMP/tpm"
          swtpm socket --tpmstate dir="$RUNNER_TEMP/tpm" --tpm2 --server type=tcp,port=2321 --ctrl type=tcp,port=2322 --flags not-need-init,startup-clear --daemon
          node --test test/broker.test.js
        env:
          SAATHI_TCTI: swtpm:host=127.0.0.1,port=2321
          SAATHI_TPM_EXTEND_PCR7: '1'
  broker-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: cargo build --locked --release -p saathi-broker
      - run: npm ci
      - run: node --test test/broker.test.js
      - name: Windows key protection
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'saathi-key'
          New-Item -ItemType Directory -Force $dir | Out-Null
          node -e "require('fs').writeFileSync(process.argv[1], require('crypto').randomBytes(32).toString('base64') + '\n')" (Join-Path $dir 'saathi.key')
          $out = target/release/saathi-broker.exe protect --dir $dir | ConvertFrom-Json
          if ($out.error) { throw $out.error }
          if ($out.protection -notin @('tpm', 'windows-protected')) { throw "unexpected protection $($out.protection)" }
          if (Test-Path (Join-Path $dir 'saathi.key')) { throw 'the plain key file was not removed' }
          $status = target/release/saathi-broker.exe status --dir $dir | ConvertFrom-Json
          Write-Output "protected with $($out.protection); status says $($status.protection)"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -t saathi:ci .
      - run: docker run -d --name saathi -p 8787:8787 saathi:ci
      - run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8787/healthz && break; sleep 1; done
          curl -fs http://localhost:8787/healthz
          curl -fs -o /dev/null http://localhost:8787/login.html
          curl -fs http://localhost:8787/api/reference | grep -q '"countries"'
      - if: failure()
        run: docker logs saathi
