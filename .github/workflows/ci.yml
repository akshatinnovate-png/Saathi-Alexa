name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SAATHI_METRICS: 'off'
      - run: npm run eval
      - run: npx asl-validator --json-path src/escalation/escalation.asl.json
      - run: npm run a11y
        env:
          SAATHI_METRICS: 'off'
      - run: npm ci
        working-directory: infra
      - run: npm test
        working-directory: infra
      - run: npx cdk synth --quiet
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: us-east-1
      - run: pipx run cfn-lint -i W3005 -- cdk.out/Saathi.template.json
        working-directory: infra
