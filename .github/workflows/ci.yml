name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - name: Every installed package has a valid registry signature
        run: npm audit signatures
      - name: Lockfile only resolves from the npm registry over https
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const bad = Object.entries(lock.packages).filter(([k, p]) => k && p.resolved && !p.resolved.startsWith("https://registry.npmjs.org/"));
            if (bad.length) { console.error(bad.map(([k, p]) => `${k} -> ${p.resolved}`).join("\n")); process.exit(1); }
            console.log(`${Object.keys(lock.packages).length - 1} packages, all from registry.npmjs.org`);
          '
      - name: No secrets committed
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,})' -- ':!test/**' ':!*.md'; then
            echo "A secret-looking value is committed. Remove it and rotate it."; exit 1
          fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SAATHI_METRICS: 'off'
      - run: npm run eval
      - run: npx asl-validator --json-path src/escalation/escalation.asl.json
      - run: npm run a11y
        env:
          SAATHI_METRICS: 'off'
      - run: npm ci
        working-directory: infra
      - run: npm test
        working-directory: infra
      - run: npx cdk synth --quiet
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: us-east-1
      - run: pipx run cfn-lint -i W3005 -- cdk.out/Saathi.template.json
        working-directory: infra
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build -t saathi:ci .
      - run: docker run -d --name saathi -p 8787:8787 saathi:ci
      - run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8787/healthz && break; sleep 1; done
          curl -fs http://localhost:8787/healthz
          curl -fs -o /dev/null http://localhost:8787/login.html
          curl -fs http://localhost:8787/api/reference | grep -q '"countries"'
      - if: failure()
        run: docker logs saathi
