version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    groups:
      cdk:
        patterns: ['aws-cdk*', 'constructs']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
