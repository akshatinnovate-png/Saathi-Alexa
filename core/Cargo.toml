[package]
name = "saathi-core"
version = "1.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true

