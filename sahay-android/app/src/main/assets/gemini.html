  const queuedText = [];

      const decisionPrompt = ' While the task runs, execute may send an update with type DECISION: Jev paused because it needs the user. reason says why; options are the on-screen choices Jev found; plan is the current plan; screen_items is what else is visible. Ask the user one short question at once, naming up to three options with prices if shown. When they answer, call revise_plan with the complete plan from the current screen to the end: rewrite every remaining step around their answer and put any text to type in types. Do not just append their answer to the old plan. If the user changes or clarifies the request while the task runs, also call revise_plan with a complete new plan; never start a second task. For confirm_action, write a plan that taps the final button only if the user clearly said yes; otherwise plan to stop before it, or call stop_task. A DECISION pauses the phone until you call revise_plan, continue_task or stop_task, or Senku sees the user did it on the phone, so never say you are looking, ordering or working on it. While a DECISION waits, silent SCREEN updates carry what is on the phone now, because the user may act on it themselves: always go by the latest one, and never ask the user to tell you when they are done on the phone. When the phone moves past what Jev waited for, a RESUMED update comes: tell them in a few words that you are carrying on. Jev only sees the screen: name the item to tap by what the screen shows of it (title, edition, price), or say how to reach it, such as scrolling past listings that do not match. If a DECISION comes with asked_again, your last plan did not settle it: ask the user to pick one of the options by name, or check with see_screen, then call revise_plan. A DECISION with reason replan means Jev noticed its plan has gone off track on this screen: from screen_items and done_so_far, either tell the user what they must do first, or call revise_plan with a new plan from this screen. A DECISION with question comes from the planner: ask the user that question, then call revise_plan with a plan around their answer, or continue_task if they did it themselves. For missing_text, ask the user for what goes in field, such as a phone number or name the app asks for outside signing in, and call continue_task with exactly what they give. A DECISION with reason sign_in means the app named in app wants the user signed in, or to create an account, before the task can go on. Be their companion through it: say so in one short sentence, ask whether they already have an account, and if not, check they want to create one before helping. They tap and type everything on the phone themselves while Senku waits; coach them one short step at a time from screen_items and the SCREEN updates that follow each new screen, and say nothing for a screen that asks nothing new. Never ask them to say a password or a code. Senku notices when they are past it and carries on by itself with a RESUMED update. If they say they are done first, call continue_task; if they would rather not sign in, call revise_plan with a plan around it, such as continuing as a guest, or stop_task. Never ask for a password. When execute ends blocked, tell the user what its summary says they need to do, and offer to start again once they have. Once execute has ended, nothing runs on the phone until you call execute again: only say you are starting, continuing, processing or working on a task in a turn where you call execute, revise_plan or continue_task. If the user asks to carry on after a task ended, call execute with the goal and where it got to from the last updates, such as "the book is in the cart; go on with checkout", so the new plan does not start over.';

      if (openDecision && awaitingUser && !openDecision.watching && !turnAnswered && !turnText.includes('?') && openDecision.nudges < 2) {
        openDecision.nudges++;
        send({ clientContent: { turns: [{ role: 'user', parts: [{ text: `[Senku] Jev is still paused on decision #${openDecision.id} (${openDecision.reason}) and nothing is happening on the phone. Answer it now with revise_plan, continue_task or stop_task, or ask the user what you need from them. Don't say the task is moving.` }] }], turnComplete: true } });
      }
      turnText = '';
      turnAnswered = false;
    }
    for (const id of message.toolCallCancellation?.ids || []) {
      const name = pendingTools.get(id);
      pendingTools.delete(id);
      if (name === 'select_screen' || name === 'manual_selection') flushSelectionAudio();
      window.Senku.cancelAgentTool(id);
    }

} catch (error) {

  fail(`Gemini message error: ${error.message}`);
}
};
  const startMicrophone = async () => {
    audio = new AudioContext();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false });
    if (stopped) { stream.getTracks().forEach(track => track.stop()); return; }
    await audio.resume();
    source = audio.createMediaStreamSource(stream);
    processor = audio.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = event => {
      if (!active && !reconnecting) return;
      const input = event.inputBuffer.getChannelData(0);
      const ratio = audio.sampleRate / 16000;
      const output = new Int16Array(Math.floor(input.length / ratio));
      for (let i = 0; i < output.length; i++) {
        const sample = Math.max(-1, Math.min(1, input[Math.floor(i * ratio)]));
        output[i] = sample < 0 ? sample * 32768 : sample * 32767;
      }
      if (selectionPending) {
        if (selectionAudio.length < 360) selectionAudio.push(output);
      } else if (!active || socket?.readyState !== WebSocket.OPEN) {
        if (reconnectAudio.length < 12) reconnectAudio.push(output);
      } else sendAudio(output);
    };
    source.connect(processor);
    processor.connect(audio.destination);
  };
  window.receiveGeminiToken = (id, body, error) => {
    if (id !== String(requestId)) return;
    if (error) return fail(error);
    try {
      const session = JSON.parse(body);
      accessToken = session.token || '';
      apiKeys = Array.isArray(session.keys) && session.keys.length ? session.keys : (accessToken ? [accessToken] : []);
      if (typeof session.model === 'string' && session.model) { liveModels.unshift(session.model.startsWith('models/') ? session.model : 'models/' + session.model); model = liveModels[0]; }
      if (typeof session.assistant_instructions === 'string' && session.assistant_instructions.trim())
        assistantInstructions = session.assistant_instructions;
    }
    catch (_) { return fail('Invalid Gemini token response'); }
    if (!accessToken || stopped) return fail('Gemini token unavailable');
    report('connection', 'Connecting to Gemini…');
    openSocket();
    // Warm the microphone while the socket opens and Gemini processes its setup.
    if (!textInputMode) startMicrophone().catch(error => fail(`Microphone unavailable: ${error.message}`));
  };
  const fail = message => { if (stopped) return;  report('error', message); window.stopVoice(); };
  window.startVoice = initialPrompt => {
    const prompt = String(initialPrompt || '').trim();
    if (prompt) queuedText.push(prompt);
    if (starting) return;
    starting = true;
    stopped = false;
    report('state', 'thinking');
    startupTimer = setTimeout(() => fail('Gemini voice startup timed out. Please try again.'), 30000);
    report('connection', 'Requesting voice access…');
    window.Senku.requestGeminiToken(String(++requestId));
  };
  window.sendLiveTextMessage = text => {
    const value = String(text || '').trim();
    if (!value || stopped) return;
    if (active) send({ clientContent: { turns: [{ role: 'user', parts: [{ text: value }] }], turnComplete: true } });
    else queuedText.push(value);
  };
  window.startTextChat = initialText => {
    textInputMode = true;
    const text = String(initialText || '').trim();
    if (text) queuedText.push(text);
    if (active) {
      stopMicrophone();
      flushQueuedText();
    } else if (!starting) window.startVoice();
  };
  window.sendTextMessage = text => {
    const value = String(text || '').trim();
    if (!value) return;
    textInputMode = true;
    queuedText.push(value);
    if (active) {
      stopMicrophone();
      flushQueuedText();
    } else if (!starting) {
      textInputMode = true;
      window.startVoice();
    }
  };
  window.stopVoice = () => {
    if (stopped) return;
    stopped = true;
    clearTimeout(startupTimer);
    clearTimeout(goAwayTimer);
    clearTimeout(reconnectTimer);
    active = false;
    reconnecting = false;
    agentRunning = false;
    pendingTools.clear();
    selectionPending = false;
    selectionAudio.length = 0;
    reconnectAudio.length = 0;
    queuedMessages.length = 0;
    clearPlayback();
    processor?.disconnect();
    source?.disconnect();
    stream?.getTracks().forEach(track => track.stop());
    audio?.close();

    socket?.close();
    report('ended');
  };
  document.getElementById('orb-touch').addEventListener('click', window.stopVoice);
  window.addEventListener('error', event => fail(event.message || 'Gemini Live failed'));
  window.addEventListener('unhandledrejection', event => fail(String(event.reason?.message || event.reason)));
})();
</script></body></html>
