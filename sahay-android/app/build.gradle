plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseStore = System.getenv('SAATHI_KEYSTORE')

android {
    namespace 'com.senku.app'
    compileSdk 37
    defaultConfig {
        applicationId 'io.github.akshatinnovate.sahay'
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('sahayVersionCode').orElse('10000').get().toInteger()
        versionName providers.gradleProperty('sahayVersionName').orElse('1.0.0').get()
    }
    signingConfigs {
        release {
            if (releaseStore != null && new File(releaseStore).exists()) {
                storeFile file(releaseStore)
                storePassword System.getenv('SAATHI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SAATHI_KEY_ALIAS')
                keyPassword System.getenv('SAATHI_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStore != null && new File(releaseStore).exists()) signingConfig signingConfigs.release
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
