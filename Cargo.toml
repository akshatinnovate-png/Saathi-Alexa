[workspace]
resolver = "2"
members = ["core", "broker"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
